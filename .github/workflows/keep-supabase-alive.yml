name: Keep Supabase Alive

on:
  schedule:
    # Всеки 3 дни в 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://wcsdjfsohqanxcppcvvk.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_aMxRatJ2BJxE5vQIhffing_8_zMpBDO
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/nomenclatures?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
