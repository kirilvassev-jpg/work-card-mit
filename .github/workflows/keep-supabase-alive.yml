name: Keep Supabase Alive

on:
  schedule:
    # Всеки 3 дни в 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health without exposing business data
        env:
          SUPABASE_URL: https://wcsdjfsohqanxcppcvvk.supabase.co
        run: |
          curl --fail-with-body -sS \
            "$SUPABASE_URL/functions/v1/api-proxy" \
            -H 'Origin: https://kirilvassev-jpg.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"action":"health"}'
